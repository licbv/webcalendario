<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<title>Gestión de Personal</title>
<style>
:root{--navy:#0A1F44;--navy2:#0B2D66;--blue:#0B6BCB;--cyan:#019DF4;--green:#5CB615;--bg:#EEF3FA;--bd:#DDE5F0;--tx:#1A2230;--mut:#667085;--bad:#D13438;
--V:#019DF4;--G:#7C5CFC;--H:#F59E0B;--F:#16A34A;--S:#0EA5A4;--sbw:232px}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #D0D5DD;background:#fff;border-radius:6px;padding:6px 12px;font-weight:500}
button:hover{background:#F3F6FB}
button.pri{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:0}
button.pri:hover{filter:brightness(1.07)}
button.dng{color:var(--bad);border-color:#F1B5B7;background:#FFF5F5}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{border:1px solid #D0D5DD;border-radius:6px;padding:6px 10px;background:#fff;max-width:100%}
input:focus,select:focus{outline:2px solid rgba(1,157,244,.35);border-color:var(--cyan)}
h3{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--navy2)}
.mut{color:var(--mut)}.sp{flex:1}.neg{color:var(--bad)}
.hide{display:none!important}

/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
.lbox{background:#fff;border-radius:14px;padding:38px 36px;width:400px;max-width:92%;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:center}
.lbox h2{margin:14px 0 4px;font-size:21px;color:var(--navy2);letter-spacing:-.4px}
.lbox p{margin:0 0 22px;color:var(--mut)}
.fg{text-align:left;margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy2);margin-bottom:5px}
.fg input,.fg select{width:100%;padding:10px 12px}
.lbox .pri{width:100%;padding:12px;font-weight:700;font-size:14px;margin-top:4px}
.err{color:var(--bad);background:#FEE2E2;padding:8px 10px;border-radius:6px;font-weight:600;margin-top:12px;display:none;text-align:left}
.demo-note{margin-top:14px;font-size:11.5px;color:#8A4B00;background:#FFF4CE;border-radius:6px;padding:7px 10px;text-align:left}

/* layout */
#sb{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:linear-gradient(180deg,#0A1F44,#0B2D66);color:#C9D3E3;display:none;flex-direction:column;padding:20px 12px;z-index:20}
body.in #sb{display:flex}
body.in #top,body.in main{margin-left:var(--sbw)}
.brand{padding:2px 10px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.brand small{display:block;margin-top:6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#7E8DA6}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:2px;border:0;border-radius:6px;background:none;color:#C9D3E3;text-align:left;position:relative}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(1,157,244,.26);color:#fff}
.nav.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--green)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grp{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#6B7A93;margin:18px 12px 6px}
.me{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8FA0BA}
.me b{display:block;color:#fff;font-size:13px}
.me button{margin-top:8px;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2);width:100%}
.credit{margin-top:12px;font-size:10.5px;color:#6B7A93}.credit a{color:#AEBBD0;text-decoration:none;font-weight:600}
#top{position:sticky;top:0;z-index:15;display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
body.in #top{display:flex}
#top::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--green))}
.ttl{font-size:18px;font-weight:600;letter-spacing:-.2px;margin-right:12px;color:var(--navy2)}
#top label{color:var(--mut)}
.sync{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#E7F7EC;color:#0B6B2E}
.sync.dirty{background:#FFF4CE;color:#7A4B00}.sync.busy{background:#E1F0FF;color:#0B5CAD}.sync.err{background:#FEE2E2;color:#B3171C}
.demo{font-size:11px;font-weight:800;background:#F59E0B;color:#fff;padding:3px 8px;border-radius:10px;letter-spacing:.5px}
main{display:none;padding:22px 24px}
body.in main{display:block}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(11,43,102,.06)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2 .card{margin:0}
.grid2{margin-bottom:16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:16px;overflow:hidden}
.k{padding:14px 18px;border-right:1px solid var(--bd);border-top:3px solid var(--c,var(--cyan))}
.k:last-child{border-right:0}
.k small{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.k b{display:block;font-size:30px;font-weight:600;letter-spacing:-1px;color:var(--c,var(--navy));margin:2px 0}
.k span{font-size:12px;color:var(--mut)}

/* chips */
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.cV{background:#CFEFFF;color:#00577A}.cG{background:#E6DEFF;color:#4B2FC9}.cH{background:#FFE9A8;color:#8A4B00}.cF{background:#D3F5DF;color:#0B6B2E}.cS{background:#CCF3F1;color:#0A5E5C}.cW{background:#EEF1F6;color:#41506A}.cR{background:#F9CDD1;color:#7A1520}.cX{background:#DDE1E8;color:#414B5C}
.tg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.gcard{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.gcard>h4{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;background:#F3F6FB;color:var(--navy2);display:flex;justify-content:space-between}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid #EEF1F6}
.pr .n{font-weight:500}.pr.mine{background:#F2F9FF}
.pr .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:8px;border-radius:4px;background:#EEF2F7;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:4px;background:var(--H)}
.hrow{margin-bottom:10px}.hrow>div{display:flex;justify-content:space-between}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--bd);background:#F6F7F9;position:sticky;top:0}
table.t td{padding:6px 10px;border-bottom:1px solid #EEF1F6;vertical-align:middle}
table.t td.n,table.t th.n{text-align:center}
table.t input,table.t select{border-color:transparent;background:transparent;width:100%}
table.t input:hover,table.t select:hover,table.t input:focus{border-color:#D0D5DD;background:#fff}
table.t tr.off td{opacity:.5}
.scr{max-height:68vh;overflow:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}

/* calendario */
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.yr{border-collapse:separate;border-spacing:0;font-size:10px;width:100%}
.yr th,.yr td{height:24px;min-width:15px;text-align:center;padding:0;border-right:1px solid #eef1f6;border-bottom:1px solid #eef1f6}
.yr thead th{position:sticky;top:0;z-index:3;background:#fff;font-weight:600;color:var(--mut,#64748b)}
.yr thead tr.w th{top:24px;font-size:9px;font-weight:500}
.yr th.r{position:sticky;left:0;z-index:4;background:#fff;text-align:left;min-width:165px;max-width:165px;padding:0 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr thead th.r{z-index:5}
.yr tr.gh th{background:#f3f6fb;font-size:11px;color:#0b2a5b}.yr tr.gh td{background:#f3f6fb}
.yr tr.mine th.r{box-shadow:inset 3px 0 0 var(--cyan,#019DF4)}
.yr td.cur,.yr th.cur{box-shadow:inset 0 0 0 1px #0b2a5b}
.yr td.on{color:#fff;font-weight:700}
.yr td.tt,.yr th.tt{min-width:36px;font-weight:700;background:#fafbfd}
.yr th.mo{border-left:2px solid #cfd8e6;text-align:left;padding-left:6px}
.yr td.ms{border-left:2px solid #cfd8e6}
.gw{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:8px;background:#fff}
table.cal{border-collapse:separate;border-spacing:0}
table.cal th,table.cal td{border-right:1px solid #ECEFF3;border-bottom:1px solid #ECEFF3;text-align:center;font-size:11px}
table.cal thead th{position:sticky;top:0;z-index:3;background:#F6F7F9;height:34px;min-width:36px;color:var(--navy2)}
table.cal thead th small{display:block;font-weight:500;color:var(--mut);font-size:9.5px}
table.cal thead th.today{background:#DCEBFA;color:var(--blue)}
table.cal thead th.we{background:#CBD1DB;color:#414B5C}
table.cal thead th.hol{background:#F4A9B0;color:#7A1520}
table.cal thead th.nl{background:#FFD98A;color:#6B4600}
table.cal th.r{position:sticky;left:0;z-index:4;background:#fff;text-align:left;min-width:200px;max-width:200px;padding:0 10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.cal thead th.r{z-index:5;background:var(--navy);color:#fff}
table.cal tr.gh th.r{background:#F3F6FB;color:var(--navy2);text-transform:uppercase;font-size:11px;letter-spacing:.4px;height:28px}
table.cal tr.gh td{background:#F3F6FB}
table.cal tr.mine th.r{background:#EAF5FF;box-shadow:inset 4px 0 0 var(--cyan)}
table.cal tr.mine th.r em{font-style:normal;font-size:9.5px;background:var(--cyan);color:#fff;border-radius:8px;padding:0 6px;margin-left:6px}
td.c{height:38px;min-width:36px;padding:0;position:relative}
td.c.we{background:#DDE1E8}
td.c.hol{background:#F9CDD1}
td.c.nl{background:#FFEBBE}
td.c.today{box-shadow:inset 2px 0 0 var(--blue),inset -2px 0 0 var(--blue)}
td.c.ed{cursor:pointer}td.c.ed:hover{filter:brightness(.93)}
td.c .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:100%}
td.c.aV{background:var(--V);color:#fff}td.c.aF{background:var(--F);color:#fff}
td.c b{font-size:13px}
.tgG,.tgH,.tgS{font-size:9px;font-weight:700;line-height:1;padding:2px 3px;border-radius:3px;font-style:normal;box-shadow:0 0 0 1px #fff}
.tgG{background:var(--G);color:#fff}.tgH{background:var(--H);color:#3b2400}.tgS{background:var(--S);color:#fff}
table.cal td.tot{min-width:34px;font-weight:600;background:#FAFBFD}
table.cal thead th.tot{background:var(--navy);color:#fff}
table.cal tfoot td,table.cal tfoot th.r{background:#EEF1F6;font-weight:700;position:sticky;z-index:2;height:24px;padding:0 4px;font-size:11px;border-top:0}
table.cal tfoot th.r{z-index:4;padding:0 10px}
table.cal tfoot tr:nth-last-child(1) td,table.cal tfoot tr:nth-last-child(1) th{bottom:0}
table.cal tfoot tr:nth-last-child(2) td,table.cal tfoot tr:nth-last-child(2) th{bottom:24px}
table.cal tfoot tr:nth-last-child(3) td,table.cal tfoot tr:nth-last-child(3) th{bottom:48px}
table.cal tfoot tr:nth-last-child(4) td,table.cal tfoot tr:nth-last-child(4) th{bottom:72px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(10,31,68,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:12px;padding:24px 26px;width:460px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.mbox.wide{width:640px}
.mbox h3{font-size:17px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mbox details{border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.mbox summary{cursor:pointer;padding:9px 12px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.mbox details ul{margin:0;padding:0 12px 10px 28px}.mbox li{padding:2px 0}.mbox li small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0F1B2D;color:#fff;padding:10px 18px;border-radius:8px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.tmp{font:700 26px/1 ui-monospace,Consolas,monospace;letter-spacing:3px;background:#F3F6FB;border:1px dashed var(--cyan);border-radius:8px;padding:14px;text-align:center;margin:12px 0}
.tabs{display:inline-flex;gap:2px;background:#DCE6F5;padding:3px;border-radius:8px;margin-bottom:14px}
.tabs button{border:0;background:transparent}.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(15,27,45,.16)}

@media(max-width:900px){
 #sb{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
 body.in #top,body.in main{margin-left:0}
 .brand,.grp,.me .credit,.me b{display:none}.me{margin:0;padding:0;border:0}.nav{width:auto;white-space:nowrap}
 .kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
 #top{padding:10px 14px}main{padding:14px}
 table.cal th.r{min-width:128px;max-width:128px;font-size:11px}
 .nav{padding:8px 10px}
}
</style>
</head>

function sha256(str){

  for(let i=0;i<l;i++)w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8);w[nb*16-1]=l*8;

  const x=new Array(64);
  for(let blk=0;blk<nb;blk++){
    for(let i=0;i<16;i++)x[i]=w[blk*16+i];
    for(let i=16;i<64;i++){
      const p=x[i-15],q=x[i-2];
      x[i]=(x[i-16]+(((p>>>7)|(p<<25))^((p>>>18)|(p<<14))^(p>>>3))+x[i-7]+(((q>>>17)|(q<<15))^((q>>>19)|(q<<13))^(q>>>10)))|0;
    }
    let [a,b,c,d,e,f,g,k]=h;
    for(let i=0;i<64;i++){
      const t1=(k+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K256[i]+x[i])|0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;
      k=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h=[h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+k].map(v=>v|0);
  }

}

  const mov=(m,d,n)=>{const t=new Date(y,m-1,d),w=t.getDay();put(dsOf(w===2||w===3?plusD(t,-(w-1)):w===4||w===5?plusD(t,8-w):t),n,'f');};

    out.push({ts:g.last,u:a.u,k:'ev',p:a.p,a:txt});
  }
  return out.sort((x,y)=>x.ts<y.ts?-1:1);
}

/* ---------- guardado con fusión (no pisa lo que cargaron otros) ---------- */
const SELF_FIELDS=['em','ent','salt','ph','must','last'];
async function flush(){
  if(flushing||!DB||!SID)return;
  if(!dirty()){SYNC='ok';renderSync();return;}
  clearTimeout(saveT);flushing=true;SYNC='busy';renderSync();
  const d=D,pend=PEND;D=newD();PEND=[];
  const admin=isAdmin(),sid=SID;
  try{
    const R=normalize(await A.load());
    const M=clone(R);
    d.ev.forEach(pid=>{if(admin||pid===sid)M.ev[pid]=clone(DB.ev[pid]||{});});
    d.pe.forEach(pid=>{
      const lp=DB.people[pid];
      if(admin){if(lp)M.people[pid]=clone(lp);else delete M.people[pid];}
      else if(pid===sid&&lp&&M.people[pid]){SELF_FIELDS.forEach(f=>{M.people[pid][f]=lp[f];});}
    });
    if(admin&&d.gr)M.groups=clone(DB.groups);
    if(admin&&d.hol)M.hol=clone(DB.hol||{});
    const ent=collapse(pend);
    if(d.lc&&isOwner())M.log=(M.log||[]).filter(x=>x.ts>=d.lc);
    M.log=(M.log||[]).concat(ent).slice(-1500);
    if(REMOTE){let n=JSON.stringify(M).length;while(n>MAX_BYTES&&M.log.length>30){M.log=M.log.slice(Math.ceil(M.log.length*0.15));n=JSON.stringify(M).length;}
      if(n>MAX_BYTES)throw new Error('La base superó el límite de tamaño');}
    await A.save(M);
    const cur=DB;DB=M;
    D.ev.forEach(pid=>{DB.ev[pid]=cur.ev[pid]||{};});
    D.pe.forEach(pid=>{if(cur.people[pid])DB.people[pid]=cur.people[pid];else delete DB.people[pid];});
    if(D.gr)DB.groups=cur.groups;
    if(D.hol)DB.hol=cur.hol;
    lastLoad=Date.now();SYNC=dirty()?'dirty':'ok';
  }catch(err){
    D.ev=new Set([...d.ev,...D.ev]);D.pe=new Set([...d.pe,...D.pe]);D.gr=d.gr||D.gr;D.hol=d.hol||D.hol;D.lc=(d.lc&&d.lc>D.lc)?d.lc:D.lc;PEND=pend.concat(PEND);
    SYNC='err';window.lastErr=String(err);toast('No se pudo guardar ('+err.message+'). Reintento en 15 s.');
    clearTimeout(saveT);saveT=setTimeout(flush,15000);
  }
  flushing=false;
  if(!me()&&SID){toast('Tu usuario ya no existe.');return logout(true);}
  renderSync();
  if(!document.querySelector('#modal.open')&&!busyInput())render();
}
async function reload(manual){
  if(flushing)return;
  if(dirty()){if(manual)toast('Hay cambios sin guardar: guardando primero…');await flush();}
  try{
    SYNC='busy';renderSync();
    DB=normalize(await A.load());lastLoad=Date.now();SYNC=dirty()?'dirty':'ok';
    if(!me())return logout(true);
    if(!document.querySelector('#modal.open')&&!busyInput())render();else renderSync();
    if(manual)toast('Datos actualizados');
  }catch(err){SYNC='err';renderSync();toast('No se pudo actualizar: '+err.message);}
}
const manualRefresh=()=>reload(true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SID&&Date.now()-lastLoad>5*60*1000)reload(false);});
window.addEventListener('beforeunload',e=>{if(SID&&(dirty()||flushing)){e.preventDefault();e.returnValue='Hay cambios sin guardar.';return e.returnValue;}});

/* ---------- carga de datos en el calendario ---------- */
function setDay(pid,d,fn){
  const cur=clone(dayOf(pid,d)||{});fn(cur);
  DB.ev[pid]=DB.ev[pid]||{};
  if(!cur.a&&!cur.g&&!cur.h&&!cur.s)delete DB.ev[pid][d];else DB.ev[pid][d]=cur;
  D.ev.add(pid);
}
function cellClick(pid,d){
  if(!canEdit(pid)){toast('Solo podés modificar tus propios datos');return;}
  const cur=dayOf(pid,d)||{};
  if(MODE==='V'||MODE==='F'){
    if(cur.a===MODE){setDay(pid,d,o=>{delete o.a;});rec('del',MODE,pid,d);}
    else{setDay(pid,d,o=>{o.a=MODE;});rec('set',MODE,pid,d);}
  }else if(MODE==='G'){
    if(cur.g){setDay(pid,d,o=>{delete o.g;});rec('del','G',pid,d);}
    else{setDay(pid,d,o=>{o.g=1;});rec('set','G',pid,d);}
  }else if(MODE==='H'){return openValue(pid,d,'H');}
  else if(MODE==='S'){return openValue(pid,d,'S');}
  else if(MODE==='X'){if(Object.keys(cur).length){setDay(pid,d,o=>{delete o.a;delete o.g;delete o.h;delete o.s;});rec('del','*',pid,d);}}
  render();
}

   <div class="macts">${has?`<button class="dng" data-p="${E(pid)}" data-d="${d}" data-t="${t}" onclick="delValue(this)">Quitar</button>`:''}<button onclick="closeModal()">Cancelar</button><button class="pri" data-p="${E(pid)}" data-d="${d}" data-t="${t}" onclick="saveValue(this)">Guardar</button></div>`);

function rfChg(){

  h.min=f;if(!h.dataset.t||!h.value||h.value<f)h.value=f;
}
function rangeUi(){

function applyRange(){
  const pid=$('#rp').value,t=$('#rt').value,f=$('#rf').value,h=$('#rh').value,skip=$('#rs').checked,v=$('#rv').value;
  if(!canEdit(pid))return toast('Solo podés modificar tus propios datos');
  if(!f||!h||f>h)return toast('El rango de fechas no es válido');
  const a=new Date(+f.slice(0,4),+f.slice(5,7)-1,+f.slice(8)),b=new Date(+h.slice(0,4),+h.slice(5,7)-1,+h.slice(8));
  if((b-a)/864e5>400)return toast('El rango es demasiado largo (máximo 400 días)');
  if(t==='H'&&!(parseFloat(v)>0&&parseFloat(v)<=24))return toast('Ingresá una cantidad de horas válida');
  if(t==='S'&&mins(v)==null)return toast('Ingresá una hora válida');
  let n=0;
  for(let x=new Date(a);x<=b;x.setDate(x.getDate()+1)){
    if(skip&&(x.getDay()===0||x.getDay()===6))continue;
    const d=iso(x.getFullYear(),x.getMonth(),x.getDate());n++;
    if(t==='V'||t==='F'){setDay(pid,d,o=>{o.a=t;});rec('set',t,pid,d);}
    else if(t==='G'){setDay(pid,d,o=>{o.g=1;});rec('set','G',pid,d);}
    else if(t==='H'){const hh=parseFloat(v);setDay(pid,d,o=>{o.h=hh;});rec('set','H',pid,d,hh);}
    else if(t==='S'){setDay(pid,d,o=>{o.s=v;});rec('set','S',pid,d,v);}
    else if(t==='X'){if(dayOf(pid,d)){setDay(pid,d,o=>{delete o.a;delete o.g;delete o.h;delete o.s;});rec('del','*',pid,d);}}
  }
  closeModal();render();toast(n+' '+(n===1?'día procesado':'días procesados'));
}

function renGroup(i,v){
  if(!isAdmin())return;v=v.trim();const old=DB.groups[i];
  if(!v||v===old)return render();if(DB.groups.includes(v)){toast('Ya existe ese grupo');return render();}
  DB.groups[i]=v;D.gr=true;Object.values(DB.people).forEach(p=>{if(p.g===old){p.g=v;D.pe.add(p.id);}});
  logTxt(`Renombró el grupo "${old}" a "${v}"`);render();
}
function delGroup(i){
  if(!isAdmin())return;const g=DB.groups[i];
  if(Object.values(DB.people).some(p=>p.g===g))return toast('Hay personas en ese grupo: movelas antes de eliminarlo');
  if(!confirm('¿Eliminar el grupo "'+g+'"?'))return;
  DB.groups.splice(i,1);D.gr=true;logTxt(`Eliminó el grupo "${g}"`);render();
}

/* ---------- VISTA: Resumen ---------- */
function weeksOf(y){
  const w=[],st=new Date(y,0,1);st.setDate(st.getDate()-((st.getDay()+6)%7));
  for(let x=new Date(st);x<=new Date(y,11,31);x.setDate(x.getDate()+7)){
    const days=[];for(let i=0;i<7;i++){const d=new Date(x.getFullYear(),x.getMonth(),x.getDate()+i);if(d.getFullYear()===y)days.push(iso(y,d.getMonth(),d.getDate()));}
    const th=new Date(x.getFullYear(),x.getMonth(),x.getDate()+3);
    const mo=th.getFullYear()<y?0:th.getFullYear()>y?11:th.getMonth();
    const j=new Date(th.getFullYear(),0,1),wn=Math.ceil(((th-j)/864e5+1)/7);
    w.push({days,mo,wn,from:x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())});
  }
  return w;
}
function vYear(ps){
  const y=RY,ws=weeksOf(y),t=todayS(),ty=RT;
  const col={V:'var(--V)',G:'var(--G)',F:'var(--F)'}[ty];
  const hit=(pid,d)=>{const e=dayOf(pid,d);return e&&(ty==='G'?e.g:e.a===ty);};
  const mh=[];ws.forEach((w,i)=>{if(i&&mh[mh.length-1].mo===w.mo)mh[mh.length-1].n++;else mh.push({mo:w.mo,n:1});});
  const head=`<thead><tr><th class="r" rowspan="2">Persona</th>${mh.map(m=>`<th class="mo" colspan="${m.n}">${MESES[m.mo].slice(0,3)}</th>`).join('')}<th class="tt" rowspan="2">Total</th></tr><tr class="w">${ws.map((w,i)=>`<th class="${w.days.includes(t)?'cur':''} ${i&&ws[i-1].mo!==w.mo?'ms':''}" title="Semana del ${fmtD(w.days[0])}">${w.wn}</th>`).join('')}</tr></thead>`;
  let body='';
  DB.groups.forEach(g=>{
    const gp=ps.filter(p=>p.g===g);if(!gp.length)return;
    body+=`<tr class="gh"><th class="r">${E(g)} · ${gp.length}</th><td colspan="${ws.length+1}"></td></tr>`;
    gp.forEach(p=>{
      let tot=0;
      const cells=ws.map((w,i)=>{
        const ds=w.days.filter(d=>hit(p.id,d));tot+=ds.length;
        const ms=i&&ws[i-1].mo!==w.mo?'ms':'';
        const cur=w.days.includes(t)?'cur':'';
        if(!ds.length)return `<td class="${ms} ${cur}"></td>`;
        const pc=ds.length>=5?100:ds.length>=3?72:45;
        const tip=`${nm(p)} · ${LAB[ty]}: ${ds.length===1?fmtD(ds[0]):fmtD(ds[0])+' a '+fmtD(ds[ds.length-1])} (${ds.length} día${ds.length>1?'s':''})`;
        return `<td class="on ${ms} ${cur}" style="background:color-mix(in srgb,${col} ${pc}%,#fff)" title="${E(tip)}">${ds.length}</td>`;
      }).join('');
      body+=`<tr class="${p.id===SID?'mine':''}"><th class="r" title="${E(nm(p))}">${E(nm(p))}${p.id===SID?'<em>vos</em>':''}</th>${cells}<td class="tt">${tot||''}</td></tr>`;
    });
  });
  const foot=`<tr class="gh"><th class="r">Personas con ${LAB[ty].toLowerCase()}</th>${ws.map((w,i)=>{const c=ps.filter(p=>w.days.some(d=>hit(p.id,d))).length;return `<td class="${i&&ws[i-1].mo!==w.mo?'ms':''}" style="font-weight:700">${c||''}</td>`;}).join('')}<td></td></tr>`;
  return `<div class="card"><h3>Panorama del año ${y}</h3>
   <div class="tb" style="margin-bottom:10px"><button onclick="RY--;render()">‹</button><b style="min-width:44px;text-align:center">${y}</b><button onclick="RY++;render()">›</button>${y!==NOW.getFullYear()?'<button onclick="RY=NOW.getFullYear();render()">Este año</button>':''}
    <select onchange="RT=this.value;render()">${[['V','Vacaciones'],['G','Guardias'],['F','Francos']].map(([k,l])=>`<option value="${k}" ${k===ty?'selected':''}>${l}</option>`).join('')}</select>
    <span class="mut">Cada columna es una semana (lunes a domingo) y el número es la cantidad de días. Pasá el mouse por una celda para ver las fechas.</span></div>
   <div class="gw"><table class="yr">${head}<tbody>${body||'<tr><td style="padding:20px">No hay personas en esta vista.</td></tr>'}</tbody><tfoot>${foot}</tfoot></table></div></div>`;
}
function vRes(){
  const{y,m}=YM,t=todayS(),ps=visible();
  const st=ps.map(p=>({p,s:stats(p.id,y,m),td:todayInfo(p,t),e:dayOf(p.id,t)||{}}));
  const cnt=k=>st.filter(x=>x.td.t===k).length;
  const gHoy=st.filter(x=>x.e.g).length,heTot=st.reduce((a,x)=>a+x.s.H,0);
  const hd=holOf(t),wdn=new Date().getDay();
  const hoyTag=hd?`<span class="chip ${hd.t==='nl'?'cH':'cR'}">${hd.t==='nl'?'No laborable':'Feriado'}: ${E(hd.n)}</span>`:(wdn%6===0?'<span class="chip cX">Fin de semana</span>':'');
  const kp=`<div class="kpis">
   <div class="k" style="--c:var(--cyan)"><small>Personal</small><b>${ps.length}</b><span>${GF==='ALL'?DB.groups.filter(g=>ps.some(p=>p.g===g)).length+' grupos':E(GF)}</span></div>
   <div class="k" style="--c:var(--V)"><small>Hoy de vacaciones</small><b>${cnt('V')}</b><span>${fmtD(t)}</span></div>
   <div class="k" style="--c:var(--G)"><small>Hoy de guardia</small><b>${gHoy}</b><span>${fmtD(t)}</span></div>
   <div class="k" style="--c:var(--F)"><small>Hoy de franco</small><b>${cnt('F')}</b><span>${fmtD(t)}</span></div>
   <div class="k" style="--c:var(--H)"><small>Horas extras · ${MESES[m].toLowerCase()}</small><b>${fh(heTot)}</b><span>horas en el mes</span></div></div>`;
  const hoy=DB.groups.filter(g=>st.some(x=>x.p.g===g)).map(g=>`<div class="gcard"><h4><span>${E(g)}</span><span>${st.filter(x=>x.p.g===g).length}</span></h4>${st.filter(x=>x.p.g===g).map(x=>`<div class="pr ${x.p.id===SID?'mine':''}"><span class="n">${E(nm(x.p))}</span><span class="tags">${typeChip(x.td.t,E(x.td.txt))}${x.e.g?typeChip('G','Guardia'):''}${x.e.h?typeChip('H','+'+fh(x.e.h)+' h'):''}</span></div>`).join('')}</div>`).join('');
  const he=st.filter(x=>x.s.H>0).sort((a,b)=>b.s.H-a.s.H).slice(0,10),hmax=he.length?he[0].s.H:1;
  const heHtml=he.length?he.map(x=>`<div class="hrow"><div><span>${E(nm(x.p))}</span><b>${fh(x.s.H)} h</b></div><div class="bar"><i style="width:${x.s.H/hmax*100}%"></i></div></div>`).join(''):'<p class="mut">Nadie cargó horas extras en este mes.</p>';
  /* próximos 14 días */
  const up=[],base=new Date();
  for(const p of ps){
    for(const ty of ['V','G','F']){
      let a=null,b=null;
      const push=()=>{if(a)up.push({from:a,to:b,p,ty});a=b=null;};
      for(let i=0;i<14;i++){
        const x=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i),d=iso(x.getFullYear(),x.getMonth(),x.getDate()),e=dayOf(p.id,d);
        const on=e&&(ty==='G'?e.g:e.a===ty);
        if(on){if(!a)a=d;b=d;}else push();
      }
      push();
    }
  }
  up.sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
  const upHtml=up.length?`<table class="t"><tbody>${up.slice(0,40).map(r=>`<tr><td style="width:110px"><b>${r.from===r.to?fmtD(r.from):fmtD(r.from)+' al '+fmtD(r.to)}</b></td><td>${E(nm(r.p))}</td><td>${typeChip(r.ty,LAB[r.ty])}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">No hay vacaciones, guardias ni francos cargados para los próximos 14 días.</p>';
  const grows=DB.groups.filter(g=>st.some(x=>x.p.g===g)).map(g=>{const xs=st.filter(x=>x.p.g===g);const S=k=>xs.reduce((a,x)=>a+x.s[k],0);return `<tr><td><b>${E(g)}</b></td><td class="n">${xs.length}</td><td class="n">${S('V')||'–'}</td><td class="n">${S('G')||'–'}</td><td class="n">${S('H')?fh(S('H')):'–'}</td><td class="n">${S('F')||'–'}</td></tr>`;}).join('');
  return kp+vYear(ps)+`<div class="card"><h3>Hoy · ${fmtD(t)} ${hoyTag}</h3><div class="tg-grid">${hoy||'<p class="mut">No hay personal en esta vista.</p>'}</div></div>
   <div class="grid2"><div class="card"><h3>Próximos 14 días</h3>${upHtml}</div><div class="card"><h3>Horas extras de ${MESES[m].toLowerCase()}</h3>${heHtml}</div></div>
   <div class="card"><h3>Totales de ${MESES[m].toLowerCase()} ${y} por grupo</h3><table class="t"><thead><tr><th>Grupo</th><th class="n">Personas</th><th class="n">Vacaciones (días)</th><th class="n">Guardias</th><th class="n">Horas extras</th><th class="n">Francos</th></tr></thead><tbody>${grows}</tbody></table></div>`;
}

  const head=`<tr><th class="r">Persona</th>${days.map(x=>`<th class="${x.s===t?'today':''} ${dc(x)}" ${x.h?`title="${E(x.h.n)}"`:''}>${x.d}<small>${DOW[x.w]}</small></th>`).join('')}<th class="tot">Vac.</th><th class="tot">Guar.</th><th class="tot">H.E.</th><th class="tot">Fra.</th></tr>`;

       <td class="tot">${s.V||''}</td><td class="tot">${s.G||''}</td><td class="tot">${s.H?fh(s.H):''}</td><td class="tot">${s.F||''}</td></tr>`;

let XLP=null;
function loadXlsx(){
  if(window.XLSX)return Promise.resolve();
  if(XLP)return XLP;
  XLP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=()=>{XLP=null;rej(new Error('No se pudo cargar el módulo de Excel. Revisá tu conexión.'));};document.head.appendChild(s);});
  return XLP;
}
const TIPO_X={V:'Vacaciones',F:'Franco'};
async function exportXlsx(){
  if(!isAdmin())return;
  try{await loadXlsx();}catch(e){return toast(e.message);}
  const W=XLSX.utils,wb=W.book_new(),ps=Object.values(DB.people).sort((a,b)=>(a.g||'').localeCompare(b.g||'')||nm(a).localeCompare(nm(b)));
  const ev=[['Usuario','Apellido y nombre','Grupo','Fecha','Tipo','Guardia','Horas extras','Horario especial']];
  ps.forEach(p=>Object.keys(DB.ev[p.id]||{}).sort().forEach(d=>{const e=DB.ev[p.id][d];
    ev.push([p.id,nm(p),p.g,d,TIPO_X[e.a]||'',e.g?'SI':'',e.h||'',e.s||'']);}));
  const sEv=W.aoa_to_sheet(ev);sEv['!cols']=[{wch:14},{wch:30},{wch:16},{wch:12},{wch:12},{wch:9},{wch:13},{wch:16}];
  const pe=[['Usuario','Apellido','Nombre','Grupo','Jornada (horas)','Entrada habitual','Email','Activo']];
  ps.forEach(p=>pe.push([p.id,p.ap,p.no,p.g,jdNum(p.jd),p.ent||'',p.em||'',p.on===false?'NO':'SI']));
  const sPe=W.aoa_to_sheet(pe);sPe['!cols']=[{wch:14},{wch:20},{wch:22},{wch:16},{wch:15},{wch:16},{wch:34},{wch:8}];
  const rs=[['Usuario','Apellido y nombre','Grupo','Año','Mes','Vacaciones (días)','Guardias','Horas extras','Francos']];
  const yrs=new Set();ps.forEach(p=>Object.keys(DB.ev[p.id]||{}).forEach(d=>yrs.add(+d.slice(0,4))));
  ps.forEach(p=>[...yrs].sort().forEach(y=>{for(let m=0;m<12;m++){const s=stats(p.id,y,m);if(s.V||s.G||s.H||s.F)rs.push([p.id,nm(p),p.g,y,MESES[m],s.V,s.G,s.H,s.F]);}}));
  const sRs=W.aoa_to_sheet(rs);sRs['!cols']=[{wch:14},{wch:30},{wch:16},{wch:7},{wch:12},{wch:17},{wch:10},{wch:13},{wch:9}];
  const lee=[['Cómo usar este archivo'],[''],
   ['Hoja "Eventos": una fila por persona y día. Tipo = Vacaciones o Franco (o vacío). Guardia = SI (o vacío). Horas extras = número. Horario especial = HH:MM.'],
   ['Fecha: AAAA-MM-DD (también se acepta DD/MM/AAAA o una fecha de Excel).'],
   ['Hoja "Personal": Usuario, Apellido, Nombre, Grupo, Jornada (horas), Entrada habitual, Email, Activo. Un usuario nuevo se crea con clave = su usuario.'],
   ['Hoja "Resumen mensual": solo informativa, se ignora al importar.'],
   ['Para importar: Administración > Excel > Importar. Las hojas Eventos y Personal son opcionales.']];
  const sL=W.aoa_to_sheet(lee);sL['!cols']=[{wch:140}];
  W.book_append_sheet(wb,sEv,'Eventos');W.book_append_sheet(wb,sPe,'Personal');W.book_append_sheet(wb,sRs,'Resumen mensual');
  if(isOwner()){const lg=[['Fecha y hora','Usuario','Acción']];(DB.log||[]).forEach(x=>lg.push([new Date(x.ts).toLocaleString('es-AR'),nm(DB.people[x.u]),x.a]));
    const sG=W.aoa_to_sheet(lg);sG['!cols']=[{wch:20},{wch:30},{wch:100}];W.book_append_sheet(wb,sG,'Registro');}
  W.book_append_sheet(wb,sL,'Leeme');
  XLSX.writeFile(wb,'gestion-personal-'+todayS()+'.xlsx');
  logTxt('Exportó los datos a Excel');toast('Excel exportado');
}
const hkey=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function xlDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate());
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return iso(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
  const s=String(v||'').trim();let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return chkD(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s)))return chkD(+m[3],+m[2],+m[1]);
  return null;
}
function chkD(y,mo,d){const t=new Date(y,mo-1,d);return(t.getFullYear()===y&&t.getMonth()===mo-1&&t.getDate()===d&&y>=2000&&y<=2100)?iso(y,mo-1,d):null;}
function xlTime(v){
  if(v===''||v==null)return '';
  if(typeof v==='number'&&v>=0&&v<1){const m=Math.round(v*1440);return hm(m);}
  const s=String(v).trim(),m=/^(\d{1,2}):(\d{2})/.exec(s);
  if(!m||+m[1]>23||+m[2]>59)return null;return p2(+m[1])+':'+m[2];
}
const yes=v=>/^(si|s|x|1|true|yes)$/i.test(hkey(v));
function pickSheet(wb,name){const k=wb.SheetNames.find(n=>hkey(n)===name);return k?wb.Sheets[k]:null;}
function rowsOf(ws){
  const raw=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true,cellDates:false});
  return raw.map(r=>{const o={};Object.keys(r).forEach(k=>o[hkey(k)]=r[k]);return o;});
}
let IMP=null;
function openImport(){
  if(!isAdmin())return;
  openModal(`<h3>Importar Excel</h3>
   <p class="mut">Elegí un archivo .xlsx con las hojas <b>Eventos</b> y/o <b>Personal</b> (podés partir de uno exportado desde acá). Antes de aplicar nada vas a ver un resumen.</p>
   <div class="fg"><label>Archivo</label><input type="file" id="xf" accept=".xlsx,.xls" onchange="readImport(this.files[0])"></div>
   <div id="xprev"></div>
   <div class="macts"><button onclick="IMP=null;closeModal()">Cerrar</button></div>`,true);
}
async function readImport(file){
  const box=$('#xprev');IMP=null;if(!file){box.innerHTML='';return;}
  box.innerHTML='<p class="mut">Leyendo…</p>';
  try{
    await loadXlsx();
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const errs=[],evs=[],pers=[];
    const sP=pickSheet(wb,'personal'),sE=pickSheet(wb,'eventos');
    if(!sP&&!sE)throw new Error('No encontré las hojas "Eventos" ni "Personal".');
    const known=new Set(Object.keys(DB.people)),newGroups=new Set(),seen=new Set();
    if(sP)rowsOf(sP).forEach((r,i)=>{
      const n=i+2,id=String(r.usuario||'').trim().toUpperCase();if(!id)return;
      if(!/^[A-Z0-9_]{2,20}$/.test(id))return errs.push(`Personal, fila ${n}: usuario "${id}" no válido`);
      if(seen.has(id))return errs.push(`Personal, fila ${n}: usuario "${id}" repetido`);seen.add(id);
      const o={id,ap:String(r.apellido||'').trim(),no:String(r.nombre||'').trim(),g:String(r.grupo||'').trim(),em:String(r.email||'').trim().toLowerCase()};
      const j=r.jornadahoras!==undefined?r.jornadahoras:r.jornada;
      if(j!==''&&j!==undefined){const h=typeof j==='number'?j:parseFloat(String(j).replace(',','.'));
        if(typeof j==='string'&&/^\d{1,2}:\d{2}$/.test(j.trim()))o.jd=p2(+j.trim().split(':')[0])+':'+j.trim().split(':')[1];
        else if(h>=1&&h<=16)o.jd=hm(Math.round(h*60));else return errs.push(`Personal, fila ${n}: jornada "${j}" no válida (1 a 16 horas)`);}
      if(r.entradahabitual!==''&&r.entradahabitual!==undefined){const t=xlTime(r.entradahabitual);if(t===null)return errs.push(`Personal, fila ${n}: entrada "${r.entradahabitual}" no válida`);o.ent=t;}
      if(r.activo!==''&&r.activo!==undefined)o.on=!/^(no|n|0|false)$/i.test(hkey(r.activo));
      const ex=DB.people[id];
      if(!ex){if(!o.ap||!o.no||!o.g)return errs.push(`Personal, fila ${n}: para crear a ${id} faltan apellido, nombre o grupo`);known.add(id);o.isNew=true;}
      if(o.g&&!DB.groups.includes(o.g))newGroups.add(o.g);
      pers.push(o);
    });
    if(sE)rowsOf(sE).forEach((r,i)=>{
      const n=i+2,id=String(r.usuario||'').trim().toUpperCase();
      if(!id&&!r.fecha)return;
      if(!known.has(id))return errs.push(`Eventos, fila ${n}: el usuario "${id||'(vacío)'}" no existe`);
      const d=xlDate(r.fecha);if(!d)return errs.push(`Eventos, fila ${n}: fecha "${r.fecha}" no válida`);
      const e={},t=hkey(r.tipo);
      if(t){if(t.startsWith('vac'))e.a='V';else if(t.startsWith('fra'))e.a='F';else return errs.push(`Eventos, fila ${n}: tipo "${r.tipo}" no válido (Vacaciones o Franco)`);}
      if(yes(r.guardia))e.g=1;
      if(r.horasextras!==''&&r.horasextras!==undefined){const h=parseFloat(String(r.horasextras).replace(',','.'));if(!(h>0&&h<=24))return errs.push(`Eventos, fila ${n}: horas extras "${r.horasextras}" no válidas`);e.h=h;}
      if(r.horarioespecial!==''&&r.horarioespecial!==undefined){const s=xlTime(r.horarioespecial);if(s===null)return errs.push(`Eventos, fila ${n}: horario "${r.horarioespecial}" no válido`);e.s=s;}
      if(!e.a&&!e.g&&!e.h&&!e.s)return;
      evs.push({id,d,e});
    });
    IMP={name:file.name,errs,evs,pers,newGroups:[...newGroups]};
    const nPe=new Set(evs.map(x=>x.id)).size,nNew=pers.filter(x=>x.isNew).length;
    box.innerHTML=`<div class="card" style="margin:10px 0"><b>${E(file.name)}</b>
     <ul style="margin:8px 0 0 18px;line-height:1.6">
      ${sE?`<li><b>${evs.length}</b> días con datos de <b>${nPe}</b> personas</li>`:''}
      ${sP?`<li>Personal: <b>${pers.length}</b> filas (${nNew} nuevas${newGroups.size?', grupos nuevos: '+[...newGroups].map(E).join(', '):''})</li>`:''}
      <li style="color:${errs.length?'#B42318':'inherit'}"><b>${errs.length}</b> filas con errores${errs.length?' (se omiten):':''}</li></ul>
     ${errs.length?`<div class="scr" style="max-height:130px;margin-top:6px;font-size:12px">${errs.slice(0,40).map(x=>E(x)+'<br>').join('')}${errs.length>40?'… y '+(errs.length-40)+' más':''}</div>`:''}</div>
     ${sE?`<div class="fg"><label>Qué hacer con los eventos</label><select id="xm"><option value="m">Actualizar: agrega y modifica los días del Excel, no toca los demás</option><option value="r">Reemplazar: deja los eventos exactamente como en el Excel (borra el resto)</option></select></div>`:''}
     <div class="macts"><button class="pri" onclick="applyImport()" ${evs.length||pers.length?'':'disabled'}>Aplicar importación</button></div>`;
  }catch(e){box.innerHTML=`<p class="neg">${E(e.message||e)}</p>`;}
}
function applyImport(){
  if(!isAdmin()||!IMP)return;
  const replace=$('#xm')&&$('#xm').value==='r';
  if(replace&&!confirm('Vas a BORRAR todos los eventos que no estén en el Excel (vacaciones, guardias, horas extras, francos). ¿Continuar?'))return;
  let cPe=0,nNew=0,days=0,chg=0;
  IMP.newGroups.forEach(g=>{DB.groups.push(g);D.gr=true;});
  IMP.pers.forEach(o=>{
    let p=DB.people[o.id];
    if(!p){const t=o.id.toLowerCase(),salt=genSalt();
      p=DB.people[o.id]={id:o.id,ap:o.ap,no:o.no,g:o.g,jd:o.jd||'',em:o.em||'',ent:o.ent||'',role:'user',salt,ph:hashPw(t,salt),must:true,on:o.on!==false,last:null};
      D.pe.add(o.id);nNew++;return;}
    let ch=false;
    ['ap','no','g','jd','em','ent'].forEach(f=>{if(o[f]!==undefined&&o[f]!==''&&p[f]!==o[f]){p[f]=o[f];ch=true;}});
    if(o.on!==undefined&&o.id!==SID&&p.on!==o.on){p.on=o.on;ch=true;}
    if(ch){D.pe.add(o.id);cPe++;}
  });
  const by={};IMP.evs.forEach(x=>{(by[x.id]=by[x.id]||{})[x.d]=x.e;});
  if(replace)Object.keys(DB.ev).forEach(id=>{if(!by[id]&&Object.keys(DB.ev[id]||{}).length){DB.ev[id]={};D.ev.add(id);}});
  Object.keys(by).forEach(id=>{
    const cur=DB.ev[id]||{},nx=replace?{}:clone(cur);
    Object.keys(by[id]).forEach(d=>{nx[d]=by[id][d];});
    if(JSON.stringify(nx)!==JSON.stringify(cur)){DB.ev[id]=nx;D.ev.add(id);}
    days+=Object.keys(by[id]).length;
  });
  logTxt(`Importó el Excel "${IMP.name}" (${replace?'reemplazando':'actualizando'}): ${days} días de ${Object.keys(by).length} personas, ${nNew} personas nuevas, ${cPe} personas modificadas`);
  const msg=`Importación lista: ${days} días, ${nNew} nuevas, ${cPe} modificadas`;IMP=null;closeModal();render();flush();toast(msg);
}
/* ---------- borrar registro ---------- */
function openDelLog(){
  if(!isOwner())return;
  const n=(DB.log||[]).length,kb=Math.round(JSON.stringify(DB.log||[]).length/1024);
  openModal(`<h3>Borrar registro</h3><p>El registro tiene <b>${n}</b> entradas (<b>${kb} KB</b>). Esto no se puede deshacer: conviene <a href="#" onclick="exportLog();return false">exportarlo a CSV</a> antes.</p>
   <div class="fg"><label>Qué borrar</label><select id="dlm"><option value="30">Anteriores a 30 días</option><option value="90">Anteriores a 90 días</option><option value="180">Anteriores a 6 meses</option><option value="all">Todo el registro</option></select></div>
   <div class="macts"><button onclick="closeModal()">Cancelar</button><button class="dng" onclick="doDelLog()">Borrar</button></div>`);
}
function doDelLog(){
  if(!isOwner())return;
  const v=$('#dlm').value,before=(DB.log||[]).length;
  const cut=v==='all'?new Date().toISOString():new Date(Date.now()-(+v)*864e5).toISOString();
  DB.log=(DB.log||[]).filter(x=>x.ts>=cut);D.lc=D.lc&&D.lc>cut?D.lc:cut;
  logTxt(v==='all'?'Borró todo el registro anterior':`Borró el registro anterior a ${v} días (${before-DB.log.length} entradas)`);
  closeModal();render();flush();toast('Registro borrado: '+(before-DB.log.length)+' entradas');
}

window.addEventListener('DOMContentLoaded',boot);
</script>
